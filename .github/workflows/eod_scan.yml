name: Divitiae EOD Scanner

on:
  schedule:
    # 16:30 IST = 11:00 UTC (Mon-Fri)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run EOD Scanner
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/scanner.py

      - name: Commit CSV output (optional backup)
        run: |
          git config --local user.email "scanner@divitiae.com"
          git config --local user.name "Divitiae Scanner Bot"
          git add outputs/ || true
          git diff --staged --quiet || git commit -m "EOD Scan $(date +'%Y-%m-%d')"
          git push || true
