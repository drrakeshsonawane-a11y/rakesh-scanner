name: RakeshGold Scanner

on:
  schedule:
    # 16:30 IST = 11:00 UTC (Mon-Fri)
    - cron: '0 11 * * 1-5'
    # Backup trigger 15 min later in case GitHub delays the first run
    - cron: '15 11 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # required to commit + push CSV outputs

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
         pip install pandas numpy yfinance gspread google-auth requests

      - name: Run EOD Scanner
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python scripts/scanner.py

      - name: Commit CSV output (keeps repo active for scheduled workflow)
        run: |
          git config --local user.email "rakeshgold-scanner@users.noreply.github.com"
          git config --local user.name "RakeshGold Scanner Bot"
          git add outputs/ || true
          git diff --staged --quiet || git commit -m "EOD Scan $(date +'%Y-%m-%d')"
          git push origin HEAD
